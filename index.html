<style>

.badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.badge{background:#fff;border:2px solid var(--mag);border-radius:30px;padding:10px 18px;font-weight:700;color:var(--p)}

.psy{background:#fff7e0;border-left:4px solid var(--sun);padding:10px;border-radius:8px}.talk{font-style:italic;background:#f2f6fa;padding:10px;border-radius:8px}
.ck{display:flex;gap:10px;align-items:center;font-weight:400;color:var(--t);padding:4px 0}.ck input{width:22px;height:22px;flex:none}
details{border-bottom:1px solid #eee;padding:8px 0}summary{font-weight:700;cursor:pointer}

svg text{font-family:inherit}

 h+=g(L.panels.map((x,i)=>f(`panels.${i}.price`,x.w+'W panel (each)',x.price)).join('')+Object.keys(L.roof).map(r=>f('roof.'+r,r[0].toUpperCase()+r.slice(1)+' roof uplift (per panel)',L.roof[r])).join(''));
 h+=g(L.inv.map((x,i)=>f(`inv.${i}.price`,invName(x),x.price)).join(''));
 h+=g(L.pack.map((x,i)=>x.prices.map((p,j)=>f(`pack.${i}.prices.${j}`,`Hinen ${x.kw}kW + ${j+1} batter${j?'ies':'y'}`,p)).join('')).join(''));
 h+=g(L.bat.map((x,i)=>f(`bat.${i}.price`,batName(x),x.price)).join('')+['A','B','C','D'].map(r=>f('gw.'+r,RANGES.find(q=>q[0]==r)[1]+' gateway',L.gw[r])).join(''));
 h+=g(L.scaf.map((x,i)=>i?f(`scaf.${i}.0`,'Scaffold: '+x[1],x[0]):'').join('')+f('bridge','Scaffold bridging',L.bridge)+L.cable.slice(0,-1).map((x,i)=>f(`cable.${i}.0`,'Cable '+x[1],x[0])).join(''));
 h+=g(f('opt','Optimiser (each)',L.opt)+f('bird','Bird guard',L.bird)+f('iboost','Hot water diverter',L.iboost)+f('ev','EV charger (each)',L.ev));return h}
function tlSync(){document.querySelectorAll('[data-s]').forEach(i=>cfg[i.dataset.s]=i.value);cfg.tl.forEach((m,i)=>{const q=a=>document.querySelector(`[data-${a}="${i}"]`);if(q('ty')){m.y=q('ty').value;m.t=q('tt').value;m.d=q('td').value}})}
function saveSet(){tlSync();document.querySelectorAll('[data-pl]').forEach(i=>{const k=i.dataset.pl.split('.');let o=cfg.pl;for(let j=0;j<k.length-1;j++)o=o[k[j]];o[k[k.length-1]]=Math.max(-1e6,+i.value||0)});document.querySelectorAll('[data-s]').forEach(i=>cfg[i.dataset.s]=i.value);cfg.v=CFGV;LS.s('ef_cfg',JSON.stringify(cfg));S.calc.price=sysPrice();save();render()}
let dir=1;function go(i){closeVid();i=Math.max(0,Math.min(STAGES.length-1,i));if(i==S.step)return;dir=i>S.step?1:-1;S.step=Math.max(0,Math.min(STAGES.length-1,i));save();render()}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.n!=null){S.notes[t.dataset.n]=t.value;save()}
 if(t.dataset.c){S.calc[t.dataset.c]=t.value;save();const c=calc();document.getElementById('out').innerHTML=outs(c);document.getElementById('chart').innerHTML=chart(c)}});
document.addEventListener('change',e=>{if(e.target.dataset.k){S.checks[e.target.dataset.k]=e.target.checked;save()}});
function askConfirm(msg,ok,yes='Yes, start fresh'){const d=document.getElementById('cdlg');document.getElementById('cmsg').textContent=msg;document.getElementById('cyes').textContent=yes;d.classList.add('open');const done=v=>{d.classList.remove('open');document.getElementById('cyes').onclick=document.getElementById('cno').onclick=null;if(v)ok()};document.getElementById('cyes').onclick=()=>done(1);document.getElementById('cno').onclick=()=>done(0);d.onclick=e=>{if(e.target===d)done(0)};setTimeout(()=>document.getElementById('cno').focus(),50)}
function restart(skip){if(!skip){askConfirm('Start fresh for a new customer? This clears the customer\'s answers and notes. Company settings are kept.',()=>restart(true));return}closeVid();S=fresh();S.calc.price=sysPrice();save();rep.classList.remove('open');document.getElementById('ov').classList.remove('open');dir=-1;render()}
document.getElementById('restartBtn').onclick=()=>restart();
document.getElementById('back').onclick=()=>go(S.step-1);document.getElementById('next').onclick=()=>go(S.step+1);
const rep=document.getElementById('rep');document.getElementById('repBtnH').onclick=()=>document.getElementById('repBtn').click();document.getElementById('repBtn').onclick=()=>{rep.classList.toggle('open');renderRep()};document.getElementById('repClose').onclick=()=>rep.classList.remove('open');
document.querySelectorAll('#rep [data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;renderRep()});
document.addEventListener('keydown',e=>{if(document.getElementById('bmod').classList.contains('open')){if(e.key=='Escape')closeBro();return}if(document.getElementById('cdlg').classList.contains('open')){if(e.key=='Escape')document.getElementById('cno').click();return}if(document.getElementById('vmod').classList.contains('open')){if(e.key=='Escape')closeVid();return}if(/TEXTAREA|INPUT|SELECT/.test(e.target.tagName))return;if(e.key=='ArrowRight')go(S.step+1);if(e.key=='ArrowLeft')go(S.step-1);if(e.key=='r'||e.key=='R'){rep.classList.toggle('open');renderRep()}if(e.key=='o'||e.key=='O')ovT();if(e.key=='Escape'){rep.classList.remove('open');document.getElementById('ov').classList.remove('open')}});
function ovT(){const o=document.getElementById('ov');o.classList.toggle('open');if(o.classList.contains('open'))document.getElementById('thumbs').innerHTML=STAGES.map((s,i)=>`<div class="th ${i==S.step?'cur':''}" onclick="ovT();go(${i})"><div class="vp"><div>${SCR[i]()}</div></div><div class="lb">${i+1}. ${s.t}</div></div>`).join('')}
document.getElementById('ovBtn').onclick=ovT;
let tx=null,ty=0;const stg=document.getElementById('stage');stg.addEventListener('touchstart',e=>{if(document.getElementById('bmod').classList.contains('open')||document.getElementById('cdlg').classList.contains('open')||document.getElementById('ov').classList.contains('open')||document.getElementById('rep').classList.contains('open')){tx=null;return}if(document.getElementById('vmod').classList.contains('open')){tx=null;return}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.closest('.tl')){tx=null;return}tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
stg.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(S.step+(dx<0?1:-1));tx=null});
function sumText(){const c=calc();let t=`SOLAR SESSION SUMMARY – ${cfg.company}\nCustomer: ${S.name||'-'}${S.email?' <'+S.email+'>':''}\nDate: ${new Date().toLocaleString('en-GB')}\nHome: ${S.home||'-'} · People: ${S.people||'-'}\nOutcome: ${S.done?'AGREED TO PROCEED':'Not yet agreed'}\n\nNEEDS (✓ = customer agreed)\n`;
 needs().forEach(n=>t+=`${S.agreed[n]?'✓':'○'} ${n}\n`);t+=`\nADVISER: ${S.rep?S.rep.split('|').map(x=>x.trim()).filter(Boolean).join(', '):'-'}\nSYSTEM: ${sysName()}\n${specList().map(x=>'  • '+x).join('\n')}\nPRICE ${S.revealed?'(revealed)':'(not yet revealed)'}:\n${price().lines.map(l=>'  '+l[0]+': '+money(l[1])).join('\n')}\n  TOTAL: ${money(price().total)}${price().manual?' + cable over 30m (TBC)':''}\nCalculator price used: ${money(+S.calc.price||0)}\n\nFINANCIALS (${c.y} yrs)\nAnnual bill ${money(+S.calc.bill||0)}, rise ${S.calc.rise}%/yr, reduction ${S.calc.red}%, SEG ${money(+S.calc.exp||0)}/yr\nCost of inaction: ${money(c.ina)}\nTotal savings: ${money(c.sav)}\nNet benefit: ${money(c.net)}\nPayback: ${c.pay!==null?c.pay.toFixed(1)+' years':'n/a'}\n\nCHECKLISTS & REP NOTES\n`;
 STAGES.forEach((s,i)=>{t+=`${i+1}. ${s.rt}: ${s.ck.filter((_,j)=>S.checks[i+'_'+j]).length}/${s.ck.length}${S.notes[i]?'\n   '+S.notes[i].replace(/\n/g,'\n   '):''}\n`});return t}
function exportSum(){const name=`solar-session-${(S.name||'customer').replace(/\W+/g,'-')}-${new Date().toISOString().slice(0,10)}.txt`;try{const f=new File([sumText()],name,{type:'text/plain'});if(navigator.canShare&&navigator.canShare({files:[f]})&&matchMedia('(pointer:coarse)').matches){navigator.share({files:[f],title:'Solar session summary'}).catch(()=>{});return}}catch(e){}const a=document.createElement('a'),u=URL.createObjectURL(new Blob([sumText()],{type:'text/plain'}));a.href=u;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},1000)}
function confetti(){const cv=document.getElementById('confetti'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const P=Array.from({length:150},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height/2,v:2+Math.random()*4,c:['#ffb400','#10b981','#1a6aa0','#ef4444'][Math.random()*4|0],s:5+Math.random()*6}));let f=0;
 (function a(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((p.y+f)/30);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<220)requestAnimationFrame(a);else x.clearRect(0,0,cv.width,cv.height)})()}
let _rz;addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{const c=document.getElementById('chart');if(c)c.innerHTML=chart(calc())},150)});
render();
</script></body></html>
